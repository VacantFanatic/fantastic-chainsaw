<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>field notes desk — STATIC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0f0a'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%2363e08a'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%2363e08a'/%3E%3Crect x='3' y='9' width='4' height='4' fill='%2363e08a'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%2363e08a'/%3E%3C/svg%3E"
    />
    <style>
      .admin {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2.5rem 2rem 4rem;
      }

      .admin__label {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--ink-soft);
        margin: 0 0 1rem;
      }

      body.phosphor .admin__label {
        color: var(--phosphor-dim);
      }

      .admin__field {
        margin-bottom: 1.5rem;
      }

      .admin__field label {
        display: block;
        font-family: var(--mono);
        font-size: 0.8rem;
        margin-bottom: 0.4rem;
      }

      .admin__field input,
      .admin__field select,
      .admin__field textarea {
        width: 100%;
        font-family: var(--serif);
        font-size: 1rem;
        padding: 0.6rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--paper);
        color: var(--ink);
      }

      body.phosphor .admin__field input,
      body.phosphor .admin__field select,
      body.phosphor .admin__field textarea {
        border-color: var(--phosphor-line);
        background: var(--phosphor-bg);
        color: var(--phosphor-fg);
      }

      .admin__field input:focus-visible,
      .admin__field select:focus-visible,
      .admin__field textarea:focus-visible {
        outline: 2px solid var(--rust);
        outline-offset: 2px;
      }

      .admin__field textarea {
        min-height: 14rem;
        resize: vertical;
        font-family: var(--serif);
      }

      .admin__hint {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--ink-soft);
        margin-top: 0.4rem;
      }

      body.phosphor .admin__hint {
        color: var(--phosphor-dim);
      }

      .admin__submit {
        font-family: var(--mono);
        font-size: 0.85rem;
        background: transparent;
        border: 1px solid var(--ink);
        color: var(--ink);
        padding: 0.6rem 1.2rem;
        border-radius: 2px;
        cursor: pointer;
      }

      body.phosphor .admin__submit {
        border-color: var(--phosphor-fg);
        color: var(--phosphor-fg);
      }

      .admin__submit:focus-visible {
        outline: 2px solid var(--rust);
        outline-offset: 2px;
      }

      .admin__submit:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* Rust on the border only, never on the label -- --rust misses AA
         for normal text on --paper (4.47:1, see NOTES.md), and a button
         that deletes something is the last place to be cute about it. */
      .admin__submit--danger {
        border-color: var(--rust);
      }

      body.phosphor .admin__submit--danger {
        border-color: var(--phosphor-fg);
      }

      .admin__rule {
        border: 0;
        border-top: 1px dashed var(--line);
        margin: 3rem 0 2rem;
      }

      body.phosphor .admin__rule {
        border-top-color: var(--phosphor-line);
      }

      .admin__status {
        font-family: var(--mono);
        font-size: 0.85rem;
        margin-top: 1.2rem;
      }

      .admin__status[data-state="error"] {
        color: var(--rust);
      }

      .admin__status[data-state="ok"] {
        color: var(--mint);
      }

      body.phosphor .admin__status[data-state="ok"] {
        color: var(--phosphor-fg);
      }
    </style>
  </head>
  <body>
    <main class="admin">
      <p class="admin__label">publish a field note</p>
      <form id="publish-form">
        <div class="admin__field">
          <label for="field-title">title</label>
          <input id="field-title" name="title" type="text" required />
        </div>
        <div class="admin__field">
          <label for="field-body">body</label>
          <textarea id="field-body" name="body" required></textarea>
          <p class="admin__hint">
            plain text -- a blank line starts a new paragraph.
          </p>
        </div>
        <div class="admin__field">
          <label for="field-secret">secret</label>
          <input
            id="field-secret"
            name="secret"
            type="password"
            required
            autocomplete="off"
          />
        </div>
        <button class="admin__submit" type="submit">publish</button>
        <p class="admin__status" id="status" role="status"></p>
      </form>

      <hr class="admin__rule" />

      <p class="admin__label">edit a field note</p>
      <form id="edit-form">
        <div class="admin__field">
          <label for="edit-slug">note</label>
          <select id="edit-slug" name="slug" required></select>
          <p class="admin__hint" id="edit-hint">loading published notes…</p>
        </div>
        <div class="admin__field">
          <label for="edit-title">title</label>
          <input id="edit-title" name="title" type="text" required />
        </div>
        <div class="admin__field">
          <label for="edit-body">body</label>
          <textarea id="edit-body" name="body" required></textarea>
          <p class="admin__hint">
            the URL and the original date stay put -- an edit revises a note, it
            doesn't republish it.
          </p>
        </div>
        <div class="admin__field">
          <label for="edit-secret">secret</label>
          <input
            id="edit-secret"
            name="secret"
            type="password"
            required
            autocomplete="off"
          />
        </div>
        <button class="admin__submit" type="submit" disabled>
          save changes
        </button>
        <p class="admin__status" id="edit-status" role="status"></p>
      </form>

      <hr class="admin__rule" />

      <p class="admin__label">unpublish a field note</p>
      <form id="unpublish-form">
        <div class="admin__field">
          <label for="unpublish-slug">note</label>
          <select id="unpublish-slug" name="slug" required></select>
          <p class="admin__hint" id="unpublish-hint">
            loading published notes…
          </p>
        </div>
        <div class="admin__field">
          <label for="unpublish-secret">secret</label>
          <input
            id="unpublish-secret"
            name="secret"
            type="password"
            required
            autocomplete="off"
          />
        </div>
        <button
          class="admin__submit admin__submit--danger"
          type="submit"
          disabled
        >
          unpublish
        </button>
        <p class="admin__status" id="unpublish-status" role="status"></p>
      </form>
    </main>
    <script>
      // One list of published notes, shared by the edit and unpublish
      // pickers, read from the manifest the publish function already
      // generates. It's a plain static file on this same site, so listing
      // what's published needs no endpoint of its own.
      let notes = [];

      // Bodies this browser already has: whatever was just published or
      // just saved. The deployed copy of a source file lags a publish by
      // one Netlify build, and fixing a typo seconds after posting is
      // exactly the case this page exists for.
      const bodyCache = new Map();

      function el(id) {
        return document.getElementById(id);
      }

      function statusSetter(node) {
        return (state, text) => {
          node.dataset.state = state;
          node.textContent = text;
        };
      }

      async function callApi(path, payload) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || data.error || `HTTP ${res.status}`);
        }
        return data;
      }

      /* --------------------------------------------------- the pickers */

      const editSlug = el("edit-slug");
      const unpublishSlug = el("unpublish-slug");
      const editHint = el("edit-hint");
      const unpublishHint = el("unpublish-hint");
      const editButton = el("edit-form").querySelector(".admin__submit");
      const unpublishButton =
        el("unpublish-form").querySelector(".admin__submit");

      function renderPickers() {
        for (const select of [editSlug, unpublishSlug]) {
          const keep = select.value;
          select.replaceChildren(
            ...notes.map((note) => {
              const option = document.createElement("option");
              option.value = note.slug;
              option.textContent = note.title;
              return option;
            }),
          );
          if (notes.some((note) => note.slug === keep)) select.value = keep;
        }

        const empty = notes.length === 0;
        editButton.disabled = empty;
        unpublishButton.disabled = empty;
        editHint.textContent = empty
          ? "nothing published yet."
          : "pick a note to load its text.";
        unpublishHint.textContent = empty
          ? "nothing published yet."
          : "removes the note, its listing entry and its feed item. the page stays in git history.";
      }

      async function loadNotes() {
        try {
          const res = await fetch("../field-notes/posts.json", {
            cache: "no-store",
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          notes = (await res.json()).map(({ slug, title }) => ({
            slug,
            title,
          }));
          renderPickers();
          if (notes.length) loadEditable(editSlug.value);
        } catch {
          // Opening admin.html straight off disk can't read the manifest
          // (file:// blocks the fetch), which is fine -- none of this
          // works without the deployed site anyway.
          editButton.disabled = true;
          unpublishButton.disabled = true;
          editHint.textContent = unpublishHint.textContent =
            "couldn't load the post list -- open this page on the deployed site.";
        }
      }

      /* ------------------------------------------------------- publish */

      const publishForm = el("publish-form");
      const setPublishStatus = statusSetter(el("status"));
      const publishButton = publishForm.querySelector(".admin__submit");
      const publishSecret = el("field-secret");

      publishForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const title = publishForm.title.value.trim();
        const body = publishForm.body.value.trim();

        if (!title || !body) {
          setPublishStatus("error", "title and body are both required.");
          return;
        }

        publishButton.disabled = true;
        setPublishStatus("", "publishing…");

        try {
          const data = await callApi("/api/publish", {
            title,
            body,
            secret: publishSecret.value,
          });
          setPublishStatus("ok", `published -- ${data.url}`);
          publishForm.title.value = "";
          publishForm.body.value = "";
          // Usable in both pickers immediately: the endpoints read the
          // manifest from GitHub, not from the deployed site, so a note
          // can be edited or pulled back down before the build finishes.
          notes = [{ slug: data.slug, title }, ...notes];
          bodyCache.set(data.slug, body);
          renderPickers();
        } catch (error) {
          setPublishStatus("error", error.message);
        } finally {
          publishSecret.value = "";
          publishButton.disabled = false;
        }
      });

      /* ---------------------------------------------------------- edit */

      const editForm = el("edit-form");
      const setEditStatus = statusSetter(el("edit-status"));
      const editTitle = el("edit-title");
      const editBody = el("edit-body");
      const editSecret = el("edit-secret");

      // The plain-text source is a static file, same as the manifest --
      // it's what publish.mjs saves alongside the rendered page precisely
      // so that an edit starts from the words rather than from markup.
      async function loadEditable(slug) {
        const note = notes.find((n) => n.slug === slug);
        if (!note) return;
        editTitle.value = note.title;

        if (bodyCache.has(slug)) {
          editBody.value = bodyCache.get(slug);
          setEditStatus("", "");
          return;
        }

        editBody.value = "";
        setEditStatus("", "loading…");
        try {
          const res = await fetch(`../field-notes/sources/${slug}.txt`, {
            cache: "no-store",
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = (await res.text()).trim();
          bodyCache.set(slug, text);
          editBody.value = text;
          setEditStatus("", "");
        } catch {
          // A note published before sources were kept has no .txt to
          // read. Say so, rather than silently offering an empty box
          // that would quietly blank the post on save.
          setEditStatus(
            "error",
            "no saved text for this note -- whatever you write here replaces the whole post.",
          );
        }
      }

      editSlug.addEventListener("change", () => loadEditable(editSlug.value));

      editForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const slug = editSlug.value;
        const title = editTitle.value.trim();
        const body = editBody.value.trim();

        if (!slug) {
          setEditStatus("error", "pick a note first.");
          return;
        }
        if (!title || !body) {
          setEditStatus("error", "title and body are both required.");
          return;
        }

        editButton.disabled = true;
        setEditStatus("", "saving…");

        try {
          const data = await callApi("/api/edit", {
            slug,
            title,
            body,
            secret: editSecret.value,
          });
          bodyCache.set(slug, body);
          notes = notes.map((note) =>
            note.slug === slug ? { ...note, title: data.title } : note,
          );
          renderPickers();
          setEditStatus("ok", `saved -- ${data.url}`);
        } catch (error) {
          setEditStatus("error", error.message);
        } finally {
          editSecret.value = "";
          editButton.disabled = notes.length === 0;
        }
      });

      /* ----------------------------------------------------- unpublish */

      const unpublishForm = el("unpublish-form");
      const setUnpublishStatus = statusSetter(el("unpublish-status"));
      const unpublishSecret = el("unpublish-secret");

      unpublishForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const slug = unpublishSlug.value;
        const label = notes.find((n) => n.slug === slug)?.title ?? slug;

        if (!slug) {
          setUnpublishStatus("error", "pick a note first.");
          return;
        }
        if (!window.confirm(`Unpublish "${label}"? This can't be undone.`)) {
          return;
        }

        unpublishButton.disabled = true;
        setUnpublishStatus("", "unpublishing…");

        try {
          const data = await callApi("/api/unpublish", {
            slug,
            secret: unpublishSecret.value,
          });
          notes = notes.filter((note) => note.slug !== slug);
          bodyCache.delete(slug);
          renderPickers();
          if (notes.length) loadEditable(editSlug.value);
          setUnpublishStatus(
            "ok",
            `unpublished -- ${data.title}. the site rebuilds in a moment.`,
          );
        } catch (error) {
          setUnpublishStatus("error", error.message);
        } finally {
          unpublishSecret.value = "";
          unpublishButton.disabled = notes.length === 0;
        }
      });

      loadNotes();
    </script>
  </body>
</html>
