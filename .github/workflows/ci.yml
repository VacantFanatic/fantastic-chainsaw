name: CI

# Runs on every pull request, and on main as a backstop for anything that
# lands directly. The repo is private on a free plan, so main cannot be
# protected server-side yet -- see "Repo hygiene" in NOTES.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This name is load-bearing. The `main` ruleset requires a status check
    # by *context*, which is this string -- rename it here and the ruleset
    # waits forever for a context nothing reports, leaving every PR on a
    # required check that never starts. Rename both or neither.
    name: format, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # `npm install`, not `npm ci`, and deliberately so. sharp and rolldown
      # both ship optional platform packages whose optional *peer* deps
      # (@emnapi/*) npm resolves to different versions on Linux than on the
      # machine that generated the lockfile -- so `npm ci` fails with
      # "Missing: @emnapi/core from lock file" no matter how many times the
      # lock is regenerated. That's npm/cli#4828, which npm's own error
      # message cites. `--omit=optional` isn't a way out either: it strips
      # rolldown's native binding, which Astro's bundler needs to build.
      #
      # The lockfile still pins every version it can resolve; what's left
      # floating is exactly the set of platform binaries that are
      # platform-specific by definition.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      # These used to exist and never run, which meant a green tick said
      # nothing about whether the code worked. They run now.
      - name: Unit tests
        run: npm test

      # The build is the check that matters most: it's what actually
      # produces the SSR function Netlify deploys. Dummy Supabase values
      # are enough -- nothing here talks to the database.
      - name: Build
        env:
          PUBLIC_SUPABASE_URL: https://example.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

      - name: Check the SSR function was emitted
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -d .netlify/v1/functions/ssr ] || fail "no SSR function -- the adapter didn't produce one, so field notes would 404 in production"
          [ -f dist/index.html ] || fail "dist/index.html is missing -- the hand-written pages didn't make it into the build"
          [ -f dist/pages/starfield/starfield.html ] || fail "the static pieces are missing from dist/"

      # A real end-to-end pass: the built server, real auth handling, real
      # rendering, against a fake Supabase. This is the check that would
      # have caught the previous attempt shipping a 404.
      - name: Integration test
        env:
          PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          PUBLIC_SUPABASE_ANON_KEY: fake-anon-key
          SITE_URL: http://localhost:4321
        run: |
          # `astro dev` detaches into a background daemon and returns, so
          # there is no job to background here -- just something to poll
          # for, and to stop afterwards.
          npx astro dev --port 4321
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4321/admin && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4321/admin \
            || { echo "::error::dev server never came up"; npx astro dev logs; exit 1; }
          node tests/integration.mjs
          status=$?
          npx astro dev stop || true
          exit $status
