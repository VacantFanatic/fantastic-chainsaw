[build]
  command = "npm run build"
  publish = "dist"
  # Builds are still worth not wasting, but they no longer have anything to
  # do with publishing: notes live in Supabase, so writing one doesn't touch
  # this repo at all. What's left is skipping builds for commits that change
  # nothing a visitor sees. See netlify/should-deploy.mjs -- exit 0 cancels
  # the build, non-zero proceeds, which is Netlify's convention, not a typo.
  ignore = "node netlify/should-deploy.mjs"

[build.environment]
  NODE_VERSION = "22"

# The Astro Netlify adapter generates the server function itself, so there
# is no hand-written functions directory any more.

[[headers]]
  for = "/field-notes/feed.xml"

  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

# Defence in depth. The admin page already refuses to render its UI to
# anyone who isn't a signed-in admin, but there's no reason for it to be
# indexable either.
[[headers]]
  for = "/admin"

  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
